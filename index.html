    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is carbon accounting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Carbon accounting is the process of measuring and tracking greenhouse gas emissions from an organization's operations, including direct emissions (Scope 1), energy-related emissions (Scope 2), and value chain emissions (Scope 3)."
          }
        },
        {
          "@type": "Question",
          "name": "What is BRSR compliance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BRSR (Business Responsibility and Sustainability Reporting) is a mandatory disclosure framework by SEBI for the top 1000 listed companies in India, requiring annual reporting on ESG parameters including carbon emissions."
          }
        },
        {
          "@type": "Question",
          "name": "How does Zero Graph calculate emissions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zero Graph uses India-specific emission factors from authoritative sources like CEA, IPCC, and DEFRA. We follow the GHG Protocol methodology to calculate emissions across all three scopes with region-specific accuracy."
          }
        }
      ]
    }
    </script>
